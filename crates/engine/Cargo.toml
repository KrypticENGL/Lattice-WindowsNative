[package]
name = "engine"
version = "0.1.0"
edition.workspace = true

[dependencies]
cpp_demangle = "0.5"
gimli = { version = "0.34", default-features = false, features = ["read", "std"] }
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "instr_info"] }
msvc-demangler = "0.11"
object = { version = "0.40", default-features = false, features = ["read_core", "coff", "elf", "std", "compression"] }
rustc-demangle = "0.1"
serde = { version = "1", features = ["derive", "rc"] }

[lints]
workspace = true
